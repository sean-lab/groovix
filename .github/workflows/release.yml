name: Release

# Pushing a v* tag publishes groovix-<tag>.tar.gz (index.html at its root) as a GitHub Release.
# sanghyunpark.dev pins one of these releases in webapps.json and serves it at /apps/groovix/.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package
        run: |
          mkdir dist
          cp index.html dist/
          cp -r samples dist/
          tar -czf "groovix-${GITHUB_REF_NAME}.tar.gz" -C dist .
          tar -tzf "groovix-${GITHUB_REF_NAME}.tar.gz" | grep -qx "./index.html"

      # A release already made for this tag on the GitHub website only gets its asset (re)placed.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="groovix-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes
          fi
